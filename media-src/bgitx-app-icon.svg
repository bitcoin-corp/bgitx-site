<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="bGitX">
  <!-- bGitX app icon: the bCorp flag-top b, with a git branch leaving the stem to a commit node. No X in the logo. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1A1A22"/><stop offset="1" stop-color="#08080B"/></radialGradient>
    <mask id="h"><rect x="0" y="0" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(3.6) translate(-62 -60)">
    <path d="M45 30 C 58 30, 66 22, 81 22" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="87" cy="22" r="7" fill="none" stroke="url(#g)" stroke-width="4.5"/>
    <g fill="url(#g)" mask="url(#h)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g>
  </g>
</svg>
